<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.png" type="image/png">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hodely Games</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }

    /* =========================
       MENU BUTTON
       ========================= */

    .menu-btn{
      position:fixed;
      bottom:18px;
      left:18px;
      width:42px;
      height:42px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius:12px;
      cursor:pointer;
      display:grid;
      place-items:center;
      z-index:100;
      transition: opacity .2s ease, transform .2s ease, background .2s ease, border .2s ease;
      opacity:.82;
      box-shadow: 0 8px 24px rgba(0,0,0,0.24);
    }

    .menu-btn:hover{
      opacity:1;
      transform:translateY(-1px);
      background:rgba(255,255,255,0.20);
      border-color:rgba(255,255,255,0.28);
    }

    .burger{
      width:18px;
      height:12px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .burger span{
      display:block;
      height:2px;
      background:#fff;
      border-radius:2px;
      opacity:.95;
      transition: transform .2s ease, opacity .2s ease;
    }

    .menu-btn.active .burger span:nth-child(1){
      transform: translateY(5px) rotate(45deg);
    }
    .menu-btn.active .burger span:nth-child(2){
      opacity:0;
    }
    .menu-btn.active .burger span:nth-child(3){
      transform: translateY(-5px) rotate(-45deg);
    }

    /* =========================
       OVERLAY
       ========================= */

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.24);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity:0;
      pointer-events:none;
      transition: opacity .22s ease;
      z-index:90;
    }

    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar{
      position:fixed;
      top:0;
      left:0;
      height:100vh;
      width:290px;
      background:rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right:1px solid rgba(255,255,255,0.14);
      transform: translateX(-105%);
      transition: transform .26s cubic-bezier(.2,.8,.2,1);
      z-index:95;
      padding:18px 16px;
      display:flex;
      flex-direction:column;
      gap:14px;
      box-shadow: 18px 0 50px rgba(0,0,0,.28);
    }

    .sidebar.open{
      transform: translateX(0);
    }

    .side-title{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      padding:8px 8px 12px;
      border-bottom:1px solid rgba(255,255,255,.12);
    }

    .side-title .brand{
      font-weight:800;
      letter-spacing:-0.03em;
      font-size:1.05rem;
      color:#fff;
    }

    .side-title .mini{
      font-size:.72rem;
      letter-spacing:2px;
      opacity:.62;
      text-transform:uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color:#fff;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:6px;
      overflow:auto;
    }

    .nav::-webkit-scrollbar{
      width:8px;
    }

    .nav::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,.16);
      border-radius:999px;
    }

    .nav a{
      text-decoration:none;
      color:#fff;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.06);
      border-radius:14px;
      padding:13px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      transition: transform .16s ease, background .16s ease, border .16s ease, box-shadow .16s ease;
    }

    .nav a:hover{
      transform: translateX(4px);
      background:rgba(255,255,255,.11);
      border-color:rgba(255,255,255,.20);
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
    }

    .nav a .left{
      display:flex;
      gap:10px;
      align-items:center;
      min-width:0;
    }

    .link-label{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .pill{
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:.76rem;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.06);
      opacity:.92;
      flex-shrink:0;
      color:#fff;
    }

    .arrow{
      opacity:.52;
      transition: transform .16s ease, opacity .16s ease;
      flex-shrink:0;
      margin-left:10px;
      color:#fff;
    }

    .nav a:hover .arrow{
      opacity:.84;
      transform: translateX(2px);
    }

    .hint{
      margin-top:auto;
      padding:12px 10px 4px;
      font-size:.8rem;
      line-height:1.5;
      color:rgba(255,255,255,.62);
    }

    @media (max-width: 760px){
      .sidebar{
        width:86vw;
        max-width:320px;
      }

      .menu-btn{
        left:14px;
        bottom:14px;
      }
    }
  </style>
</head>
<body>

  <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
    <div class="burger" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </button>

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar" aria-label="Navigation menu">
    <div class="side-title">
      <div class="brand">Hodely</div>
      <div class="mini">menu</div>
    </div>

    <nav class="nav">
      <a href="https://hodely.net" title="Go to hodely.net">
        <div class="left">
          <span class="pill">/</span>
          <span class="link-label">Home</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/a" title="Go to hodely.net/a">
        <div class="left">
          <span class="pill">/a</span>
          <span class="link-label">A</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/VerdaNet" title="Go to hodely.net/VerdaNet">
        <div class="left">
          <span class="pill">/VerdaNet</span>
          <span class="link-label">VerdaNet</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/HodelyDrive" title="Go to hodely.net/HodelyDrive">
        <div class="left">
          <span class="pill">/Drive</span>
          <span class="link-label">HodelyDrive</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/screenshot" title="Go to hodely.net/screenshot">
        <div class="left">
          <span class="pill">/screenshot</span>
          <span class="link-label">Screenshot</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://www.hodely.net/schedule" title="Go to hodely.net/schedule">
        <div class="left">
          <span class="pill">/schedule</span>
          <span class="link-label">Schedule</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/periodictable" title="Go to hodely.net/periodictable">
        <div class="left">
          <span class="pill">/table</span>
          <span class="link-label">Periodic Table</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/HodelyOS" title="Go to hodely.net/HodelyOS">
        <div class="left">
          <span class="pill">/OS</span>
          <span class="link-label">HodelyOS</span>
        </div>
        <span class="arrow">↗</span>
      </a>
<a href="https://hodely.net/Atlas/" title="Go to hodely.net/Atlas/">
        <div class="left">
          <span class="pill">/atlas</span>
          <span>Atlas</span>
        </div>
        <span class="arrow">↗</span>
      </a>
      <a href="https://hodely.net/Classifactsmuseum/" title="Go to hodely.net/Classifactsmuseum/">
        <div class="left">
          <span class="pill">/Museum</span>
          <span class="link-label">Classifacts</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/HodelyGames" title="Go to hodely.net/HodelyGames">
        <div class="left">
          <span class="pill">/Games</span>
          <span class="link-label">HodelyGames</span>
        </div>
        <span class="arrow">↗</span>
      </a>
    </nav>

    <div class="hint">Tip: press <b>ESC</b> to close the menu.</div>
  </aside>

  <iframe
    src="https://mygameshodely.netlify.app/#"
    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
    referrerpolicy="no-referrer"
  ></iframe>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    function openMenu(){
      sidebar.classList.add('open');
      overlay.classList.add('show');
      menuBtn.classList.add('active');
      menuBtn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu(){
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
      menuBtn.classList.remove('active');
      menuBtn.setAttribute('aria-expanded', 'false');
    }

    function toggleMenu(){
      if(sidebar.classList.contains('open')) closeMenu();
      else openMenu();
    }

    menuBtn.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', closeMenu);

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') closeMenu();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VerdaNet — Hodely</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" href="/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#000;
      overflow:hidden;
    }

    /* FULLSCREEN IFRAME */
    iframe{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:none;
    }

    /* BACK BUTTON */
    .back-btn{
      position:fixed;
      top:14px;
      right:14px;
      padding:8px 14px;
      font-size:0.8rem;
      letter-spacing:1px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(0,0,0,0.58);
      color:#fff;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      cursor:pointer;
      z-index:60;
      transition:all .2s ease;
    }
    .back-btn:hover{
      background:rgba(255,255,255,0.12);
      border-color:rgba(255,255,255,0.20);
      color:#fff;
    }

    /* MENU BUTTON */
    .menu-btn{
      position: fixed;
      top: 14px;
      left: 14px;
      width: 38px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 10px;
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 60;
      transition: opacity .2s ease, transform .2s ease, background .2s ease, border .2s ease;
      opacity: 0.82;
    }
    .menu-btn:hover{
      opacity: 1;
      transform: translateY(-1px);
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
    }

    .burger{
      width:18px;
      height:12px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .burger span{
      display:block;
      height:2px;
      background:#fff;
      border-radius:2px;
      opacity:0.9;
    }

    /* OVERLAY */
    .overlay{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.34);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      z-index: 50;
    }
    .overlay.show{
      opacity: 1;
      pointer-events: auto;
    }

    /* SIDEBAR */
    .sidebar{
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 280px;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255,255,255,0.08);
      transform: translateX(-105%);
      transition: transform .24s ease;
      z-index: 55;
      padding: 18px 16px;
      display:flex;
      flex-direction: column;
      gap: 14px;
      overflow-y:auto;
      box-shadow: 18px 0 50px rgba(0,0,0,0.28);
    }
    .sidebar.open{
      transform: translateX(0);
    }

    .side-title{
      display:flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 6px 6px 10px 6px;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .side-title .brand{
      font-weight: 800;
      letter-spacing: -0.8px;
      font-size: 1.05rem;
      color:#fff;
    }
    .side-title .mini{
      font-size: 0.75rem;
      letter-spacing: 2px;
      opacity: 0.55;
      text-transform: uppercase;
      color:#fff;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:6px;
    }

    .nav a{
      text-decoration:none;
      color:#fff;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.04);
      border-radius:12px;
      padding:12px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      transition: transform .15s ease, background .15s ease, border .15s ease;
    }
    .nav a:hover{
      transform: translateX(2px);
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
    }

    .nav a .left{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .pill{
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.04);
      color:#fff;
      opacity: 0.9;
      white-space: nowrap;
    }

    .arrow{
      opacity:0.5;
      flex-shrink:0;
      color:#fff;
    }

    .hint{
      margin-top:auto;
      padding:10px 8px;
      font-size:0.8rem;
      opacity:0.58;
      color:#fff;
    }

    @media (max-width: 640px){
      .sidebar{
        width: min(86vw, 300px);
      }

      .back-btn{
        padding:7px 12px;
        font-size:0.75rem;
      }
    }
  </style>
</head>

<body>

  <!-- MENU BUTTON -->
  <button class="menu-btn" id="menuBtn" aria-label="Open menu">
    <div class="burger" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </button>

  <!-- BACK BUTTON -->
  <button class="back-btn" onclick="window.location.href='https://hodely.net'">
    Back
  </button>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Navigation menu">
    <div class="side-title">
      <div class="brand">Hodely</div>
      <div class="mini">menu</div>
    </div>

    <nav class="nav">
      <a href="https://hodely.net" title="Go to hodely.net">
        <div class="left">
          <span class="pill">/</span>
          <span>Home</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/a" title="Go to hodely.net/a">
        <div class="left">
          <span class="pill">/a</span>
          <span>A</span>
        </div>
        <span class="arrow">↗</span>
      </a>

       <a href="https://hodely.net/Ai/">
          <div class="nav-left">
            <span class="pill">/Ai</span>
            <span class="nav-label">Hodely Ai</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/Bones/">
          <div class="nav-left">
            <span class="pill">/Bones</span>
            <span class="nav-label">Extinct Bones</span>
          </div>
          <span class="arrow">↗</span>
        </a>

      <a href="https://hodely.net/VerdaNet" title="Go to hodely.net/VerdaNet">
        <div class="left">
          <span class="pill">/VerdaNet</span>
          <span>VerdaNet</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/screenshot" title="Go to hodely.net/screenshot">
        <div class="left">
          <span class="pill">/screenshot</span>
          <span>Screenshot</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://www.hodely.net/schedule" title="Go to hodely.net/schedule">
        <div class="left">
          <span class="pill">/schedule</span>
          <span>Schedule</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/periodictable" title="Go to hodely.net/periodictable">
        <div class="left">
          <span class="pill">/table</span>
          <span>Periodic Table</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/HodelyOS" title="Go to hodely.net/HodelyOS">
        <div class="left">
          <span class="pill">/OS</span>
          <span>HodelyOS</span>
        </div>
        <span class="arrow">↗</span>
      </a>
<a href="https://hodely.net/Atlas/" title="Go to hodely.net/Atlas/">
        <div class="left">
          <span class="pill">/atlas</span>
          <span>Atlas</span>
        </div>
        <span class="arrow">↗</span>
      </a>
      <a href="https://hodely.net/Classifactsmuseum/" title="Go to hodely.net/Classifactsmuseum/">
        <div class="left">
          <span class="pill">/Museum</span>
          <span>Classifacts</span>
        </div>
        <span class="arrow">↗</span>
      </a>

      <a href="https://hodely.net/HodelyGames" title="Go to hodely.net/HodelyGames">
        <div class="left">
          <span class="pill">/Games</span>
          <span>HodelyGames</span>
        </div>
        <span class="arrow">↗</span>
      </a>
    </nav>

    <div class="hint">Tip: press <b>ESC</b> to close.</div>
  </aside>

  <!-- FULLSCREEN IFRAME -->
  <iframe src="https://moshfox.github.io/VerdaNet/"></iframe>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");

    function openMenu(){
      sidebar.classList.add("open");
      overlay.classList.add("show");
    }

    function closeMenu(){
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
    }

    function toggleMenu(){
      if(sidebar.classList.contains("open")) closeMenu();
      else openMenu();
    }

    menuBtn.addEventListener("click", toggleMenu);
    overlay.addEventListener("click", closeMenu);

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape"){
        closeMenu();
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HodelyMusic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.png" type="image/png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    .menu-btn{
  position:fixed;
  left:18px;
  bottom:18px;
  width:46px;
  height:46px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,0.10);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)),
    rgba(10,10,14,0.72);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:
    0 14px 36px rgba(0,0,0,0.34),
    inset 0 1px 0 rgba(255,255,255,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:100;
  transition:
    transform .28s var(--ease-soft),
    box-shadow .28s ease,
    border-color .28s ease,
    background .28s ease;
}

.burger{
  width:17px;
  height:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --ease-main:cubic-bezier(.22,.8,.2,1);
      --ease-soft:cubic-bezier(.16,1,.3,1);

      --panel-bg:rgba(14,14,18,0.72);
      --panel-bg-2:rgba(20,20,24,0.58);
      --panel-border:rgba(255,255,255,0.09);
      --panel-highlight:rgba(255,255,255,0.10);

      --item-bg:rgba(255,255,255,0.035);
      --item-bg-hover:rgba(255,255,255,0.065);
      --item-border:rgba(255,255,255,0.07);
      --item-border-hover:rgba(255,255,255,0.12);

      --text-main:rgba(255,255,255,0.96);
      --text-soft:rgba(255,255,255,0.60);
      --text-dim:rgba(255,255,255,0.42);

      --shadow-main:0 22px 60px rgba(0,0,0,0.42);
      --shadow-soft:0 12px 28px rgba(0,0,0,0.28);
    }

    html, body{
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:Inter, sans-serif;
      background:#000;
    }

    body{
      position:relative;
    }

    iframe{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      border:none;
      background:#000;
      z-index:1;
    }

    .ambient{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:2;
      overflow:hidden;
    }

    .ambient::before,
    .ambient::after{
      content:"";
      position:absolute;
      border-radius:50%;
      filter:blur(90px);
      opacity:.16;
    }

    .ambient::before{
      width:300px;
      height:300px;
      left:-80px;
      bottom:-80px;
      background:radial-gradient(circle, rgba(255,255,255,.55), transparent 70%);
    }

    .ambient::after{
      width:260px;
      height:260px;
      left:70px;
      top:60px;
      background:radial-gradient(circle, rgba(120,120,150,.45), transparent 70%);
    }

    .menu-btn{
      position:fixed;
      left:18px;
      bottom:18px;
      width:56px;
      height:56px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)),
        rgba(10,10,14,0.72);
      backdrop-filter:blur(18px) saturate(160%);
      -webkit-backdrop-filter:blur(18px) saturate(160%);
      box-shadow:
        0 14px 36px rgba(0,0,0,0.34),
        inset 0 1px 0 rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:100;
      transition:
        transform .28s var(--ease-soft),
        box-shadow .28s ease,
        border-color .28s ease,
        background .28s ease;
    }

    .menu-btn:hover{
      transform:translateY(-3px) scale(1.03);
      border-color:rgba(255,255,255,0.16);
      box-shadow:
        0 20px 44px rgba(0,0,0,0.44),
        inset 0 1px 0 rgba(255,255,255,0.10);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.04)),
        rgba(12,12,17,0.82);
    }

    .menu-btn:active{
      transform:scale(.96);
    }

    .burger{
      width:21px;
      height:14px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .burger span{
      display:block;
      height:2px;
      border-radius:999px;
      background:rgba(255,255,255,0.92);
      box-shadow:0 0 10px rgba(255,255,255,0.08);
      transform-origin:center;
      transition:
        transform .34s var(--ease-soft),
        opacity .22s ease,
        width .26s ease;
    }

    .burger span:nth-child(1){ width:100%; }
    .burger span:nth-child(2){ width:74%; margin-left:auto; }
    .burger span:nth-child(3){ width:100%; }

    .menu-btn:hover .burger span:nth-child(2){
      width:100%;
    }

    .menu-btn.active .burger span:nth-child(1){
      transform:translateY(6px) rotate(45deg);
    }

    .menu-btn.active .burger span:nth-child(2){
      opacity:0;
      transform:scaleX(.2);
    }

    .menu-btn.active .burger span:nth-child(3){
      transform:translateY(-6px) rotate(-45deg);
    }

    .overlay{
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at bottom left, rgba(255,255,255,0.05), transparent 25%),
        rgba(0,0,0,0.34);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      opacity:0;
      pointer-events:none;
      transition:opacity .34s ease;
      z-index:90;
    }

    .overlay.show{
      opacity:1;
      pointer-events:auto;
    }

    .sidebar{
      position:fixed;
      left:16px;
      bottom:16px;
      width:330px;
      max-width:calc(100vw - 32px);
      height:min(80vh, 760px);
      border-radius:30px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        linear-gradient(180deg, rgba(30,30,36,0.78), rgba(12,12,16,0.78));
      border:1px solid var(--panel-border);
      backdrop-filter:blur(26px) saturate(170%);
      -webkit-backdrop-filter:blur(26px) saturate(170%);
      box-shadow:
        0 28px 70px rgba(0,0,0,0.48),
        inset 0 1px 0 rgba(255,255,255,0.08);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      z-index:95;
      transform:translateY(22px) scale(.96);
      opacity:0;
      pointer-events:none;
      transition:
        transform .42s var(--ease-soft),
        opacity .3s ease;
    }

    .sidebar.open{
      transform:translateY(0) scale(1);
      opacity:1;
      pointer-events:auto;
    }

    .sidebar::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.06), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,0.025), transparent 55%);
      pointer-events:none;
    }

    .side-top{
      position:relative;
      padding:18px 18px 14px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      flex-shrink:0;
    }

    .brand-wrap{
      display:flex;
      flex-direction:column;
      gap:7px;
      min-width:0;
    }

    .brand-tag{
      width:fit-content;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.04);
      color:rgba(255,255,255,0.46);
      font-family:"JetBrains Mono", monospace;
      font-size:.70rem;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .brand{
      font-size:1.28rem;
      font-weight:800;
      color:var(--text-main);
      letter-spacing:-0.05em;
      line-height:1;
    }

    .brand-sub{
      color:var(--text-soft);
      font-size:.88rem;
      line-height:1.35;
    }

    .close-mini{
      width:38px;
      height:38px;
      border:none;
      border-radius:14px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      color:rgba(255,255,255,0.85);
      font-size:18px;
      cursor:pointer;
      transition:
        transform .22s ease,
        background .22s ease,
        border-color .22s ease;
      flex-shrink:0;
    }

    .close-mini:hover{
      transform:scale(1.05);
      background:rgba(255,255,255,0.08);
      border-color:rgba(255,255,255,0.12);
    }

    .nav-scroll{
      flex:1;
      min-height:0;
      overflow-y:auto;
      padding:14px;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,0.14) transparent;
    }

    .nav-scroll::-webkit-scrollbar{
      width:8px;
    }

    .nav-scroll::-webkit-scrollbar-thumb{
      background:rgba(255,255,255,0.12);
      border-radius:999px;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .nav a{
      text-decoration:none;
      color:#fff;
      min-height:58px;
      border-radius:18px;
      border:1px solid var(--item-border);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02)),
        rgba(255,255,255,0.015);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.03),
        0 8px 20px rgba(0,0,0,0.12);
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      transition:
        transform .24s var(--ease-soft),
        background .24s ease,
        border-color .24s ease,
        box-shadow .24s ease;
    }

    .nav a:hover{
      transform:translateX(4px);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03)),
        rgba(255,255,255,0.025);
      border-color:var(--item-border-hover);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 14px 26px rgba(0,0,0,0.16);
    }

    .nav-left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .pill{
      flex-shrink:0;
      padding:5px 9px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.07);
      background:rgba(255,255,255,0.04);
      color:rgba(255,255,255,0.72);
      font-family:"JetBrains Mono", monospace;
      font-size:.74rem;
    }

    .nav-label{
      font-size:.97rem;
      font-weight:600;
      color:rgba(255,255,255,0.93);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .arrow{
      flex-shrink:0;
      color:rgba(255,255,255,0.34);
      transition:
        transform .22s ease,
        color .22s ease;
    }

    .nav a:hover .arrow{
      transform:translateX(3px);
      color:rgba(255,255,255,0.75);
    }

    .side-bottom{
      padding:12px 16px 16px;
      border-top:1px solid rgba(255,255,255,0.05);
      color:var(--text-dim);
      font-size:.78rem;
      line-height:1.4;
      flex-shrink:0;
    }

    @media (max-width: 640px){
      .menu-btn{
  left:14px;
  bottom:14px;
  width:44px;
  height:44px;
  border-radius:14px;
}

      .sidebar{
        left:10px;
        bottom:10px;
        width:calc(100vw - 20px);
        max-width:none;
        height:min(76vh, 720px);
        border-radius:24px;
      }
    }
    .menu-btn{
  position:fixed;
  left:18px;
  bottom:18px;
  width:46px;
  height:46px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,0.10);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)),
    rgba(10,10,14,0.72);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  box-shadow:
    0 14px 36px rgba(0,0,0,0.34),
    inset 0 1px 0 rgba(255,255,255,0.08);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:100;
  transition:
    transform .28s var(--ease-soft),
    box-shadow .28s ease,
    border-color .28s ease,
    background .28s ease;
}

.burger{
  width:17px;
  height:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
  </style>
</head>
<body>

  <iframe src="https://musichodely.netlify.app/" title="Hodely Ai"></iframe>
  <div class="ambient"></div>

  <button class="menu-btn" id="menuBtn" aria-label="Open menu">
    <div class="burger" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
  </button>

  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar" aria-label="Navigation menu">
    <div class="side-top">
      <div class="brand-wrap">
        <div class="brand-tag">Hodely</div>
        <div class="brand">Hodely Ai</div>
        <div class="brand-sub">Navigation panel</div>
      </div>
      <button class="close-mini" id="closeMini" aria-label="Close menu">×</button>
    </div>

    <div class="nav-scroll">
      <nav class="nav">
        <a href="https://hodely.net">
          <div class="nav-left">
            <span class="pill">/</span>
            <span class="nav-label">Home</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/a">
          <div class="nav-left">
            <span class="pill">/a</span>
            <span class="nav-label">A</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/Ai/">
          <div class="nav-left">
            <span class="pill">/Ai</span>
            <span class="nav-label">Hodely Ai</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/Bones/">
          <div class="nav-left">
            <span class="pill">/Bones</span>
            <span class="nav-label">Extinct Bones</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/VerdaNet">
          <div class="nav-left">
            <span class="pill">/VerdaNet</span>
            <span class="nav-label">VerdaNet</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/screenshot">
          <div class="nav-left">
            <span class="pill">/shot</span>
            <span class="nav-label">Screenshot</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/schedule">
          <div class="nav-left">
            <span class="pill">/schedule</span>
            <span class="nav-label">Schedule</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/Atlas/">
          <div class="nav-left">
            <span class="pill">/Atlas</span>
            <span class="nav-label">Atlas</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/Classifactsmuseum/">
          <div class="nav-left">
            <span class="pill">/Museum</span>
            <span class="nav-label">Classifacts</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/HodelyGames">
          <div class="nav-left">
            <span class="pill">/Games</span>
            <span class="nav-label">HodelyGames</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/periodictable">
          <div class="nav-left">
            <span class="pill">/table</span>
            <span class="nav-label">Periodic Table</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/HodelyOS">
          <div class="nav-left">
            <span class="pill">/OS</span>
            <span class="nav-label">HodelyOS</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        <a href="https://hodely.net/Music">
          <div class="nav-left">
            <span class="pill">/Music</span>
            <span class="nav-label">HodelyMusic</span>
          </div>
          <span class="arrow">↗</span>
        </a>

        
      </nav>
    </div>

    <div class="side-bottom">
      Press <b>ESC</b> to close
    </div>
  </aside>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("overlay");
    const closeMini = document.getElementById("closeMini");

    function openMenu(){
      sidebar.classList.add("open");
      overlay.classList.add("show");
      menuBtn.classList.add("active");
    }

    function closeMenu(){
      sidebar.classList.remove("open");
      overlay.classList.remove("show");
      menuBtn.classList.remove("active");
    }

    function toggleMenu(){
      sidebar.classList.contains("open") ? closeMenu() : openMenu();
    }

    menuBtn.addEventListener("click", toggleMenu);
    overlay.addEventListener("click", closeMenu);
    closeMini.addEventListener("click", closeMenu);

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape") closeMenu();
    });
  </script>

</body>
</html>
